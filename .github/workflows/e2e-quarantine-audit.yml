name: E2E Quarantine Audit

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  quarantine-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate quarantine SLA
        run: python3 tests/e2e/check_quarantine_sla.py --file tests/e2e/quarantine.csv
