[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "coso"
version = "0.1.0"
description = "Combinatorial Structure-aware Optimization"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DCOSO_BUILD_PYTHON=ON", "-DCOSO_BUILD_TESTS=OFF"]
