[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "coso"
version = "0.1.0"
description = "Combinatorial Structure-aware Optimization"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=7.0"]
# The hooks in .githooks/ prefer .venv/bin over PATH, so `pip install -e '.[dev]'`
# is what makes their checks actually run.
#
# The clang tools take a floor, not an exact pin, so they agree with whatever
# the distro already installs: Ubuntu 24.04 ships clang 18, 26.04 ships 21.
# Safe because it was measured rather than assumed — every clang-format from
# 18.1.8 through 23.1.0 leaves all 246 files in this tree byte-identical under
# this .clang-format, and clang-tidy 18 reports nothing for the four checks
# pre-commit auto-fixes and nothing for the naming rules.
#
# ruff stays exact: it rewrites Python, its formatting does drift across
# releases, and unlike the clang tools there is no system copy to agree with.
dev = [
    "pytest>=7.0",
    "clang-format>=18",
    "clang-tidy>=18",
    "ruff==0.16.4",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DCOSO_BUILD_PYTHON=ON", "-DCOSO_BUILD_TESTS=OFF"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C901", # mccabe complexity
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
