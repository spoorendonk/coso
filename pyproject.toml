[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "coso"
version = "0.1.0"
description = "Combinatorial Structure-aware Optimization"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=7.0"]
# The hooks in .githooks/ prefer .venv/bin over PATH, so `pip install -e '.[dev]'`
# is what makes their checks actually run. The formatters are pinned exactly:
# clang-format and ruff both rewrite code, so an unpinned copy would make one
# person's commit reformat another's. clang-tidy has no 21.1.8 wheel; 21.1.6 is
# the nearest to the 21.1.x the tree was brought to a fixed point under.
dev = [
    "pytest>=7.0",
    "clang-format==21.1.8",
    "clang-tidy==21.1.6",
    "ruff==0.16.4",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DCOSO_BUILD_PYTHON=ON", "-DCOSO_BUILD_TESTS=OFF"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C901", # mccabe complexity
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
